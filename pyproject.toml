[project]
name = "company-mcp-plugin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Intellizo123", email = "pratipada.intellizo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp>=2.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
company-mcp-plugin = "company_mcp_plugin:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
